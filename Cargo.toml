[package]
name = "local-git-ops"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Offline git repository health dashboard: churn, hotspots, bus factor, bug clusters, velocity."
license = "MIT"
repository = "https://github.com/dandpz/local-git-ops"
keywords = ["git", "cli", "metrics", "churn", "technical-debt"]
categories = ["command-line-utilities", "development-tools"]
# Keep the published package to what `cargo install` needs (plus the README
# image so crates.io renders it).
include = ["src/**", "LICENSE", "README.md", "assets/**"]

# Installed command is `lgo`; the crate keeps its full name `local-git-ops`.
[[bin]]
name = "lgo"
path = "src/main.rs"

# `cargo binstall local-git-ops` — must match the archive layout produced by
# the Package step in .github/workflows/release.yml: an archive named
# local-git-ops-<version>-<target> containing <that dir>/lgo.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
# default-features = false: no ssh/https transports — the tool is strictly
# offline and this avoids pulling in an OpenSSL build.
git2 = { version = "0.21", default-features = false }
rayon = "1.12"
comfy-table = "8.0"
colored = "3.1"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
regex = "1.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
